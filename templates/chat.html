<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Ad Creator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #chat-container {
            width: 80%;
            max-width: 800px;
            height: 90vh;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }
        #chat-window {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            border-bottom: 1px solid #dddfe2;
        }
        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 18px;
            max-width: 90%; /* Allow wider for tables */
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #0084ff;
            color: white;
            align-self: flex-end;
            margin-left: auto;
        }
        .ai-message {
            background-color: #e4e6eb;
            color: #050505;
            align-self: flex-start;
        }
        #chat-form {
            display: flex;
            padding: 10px;
        }
        #message-input {
            flex-grow: 1;
            border: 1px solid #dddfe2;
            border-radius: 18px;
            padding: 10px 15px;
            font-size: 16px;
        }
        #send-button {
            background-color: #0084ff;
            color: white;
            border: none;
            border-radius: 18px;
            padding: 10px 20px;
            margin-left: 10px;
            cursor: pointer;
            font-size: 16px;
        }
        .confirmation-buttons button {
            padding: 8px 15px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #dddfe2;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f0f2f5;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="chat-window">
            <div class="message ai-message">
                Hello! I'm your AI assistant for creating Facebook Ads. What would you like to do today? For example, you can say "Let's create a new campaign for our website".
            </div>
        </div>
        <form id="chat-form">
            <input type="text" id="message-input" placeholder="Type your message..." autocomplete="off">
            <button type="submit" id="send-button">Send</button>
        </form>
        <form id="upload-form" style="display: none; padding: 10px;">
            <input type="file" id="file-input" name="file" accept="image/*,video/*">
            <button type="submit">Upload File</button>
        </form>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const uploadForm = document.getElementById('upload-form');

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const userMessage = messageInput.value.trim();
            if (!userMessage) return;

            addMessage(userMessage, 'user');
            messageInput.value = '';
            await sendChatMessage(userMessage);
        });

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('file-input');
            if (fileInput.files.length === 0) {
                addMessage('Please select a file to upload.', 'ai');
                return;
            }
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            addMessage('Uploading file...', 'ai');
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData,
                });
                const result = await response.json();
                if (result.error) {
                    throw new Error(result.error);
                }

                const id_type = result.payload.id_type;
                const id_value = result.payload.id_value;
                const messageToAi = `(User has uploaded a file. The ${id_type} is: ${id_value})`;
                addMessage(`File uploaded successfully. Informing the AI...`, 'ai');
                hideUploadForm();

                // Automatically send this information back to the AI
                await sendChatMessage(messageToAi);

            } catch (error) {
                console.error('Upload Error:', error);
                addMessage(`Upload failed: ${error.message}`, 'ai');
                hideUploadForm();
            }
        });

        function addMessage(text, sender) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', sender === 'user' ? 'user-message' : 'ai-message');
            // Use innerHTML to render newlines from the AI's formatted string
            messageElement.innerHTML = text.replace(/\n/g, '<br>');
            chatWindow.appendChild(messageElement);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function addConfirmationMessage(text) {
            addMessage(text, 'ai');

            const confirmationButtons = document.createElement('div');
            confirmationButtons.classList.add('confirmation-buttons');

            const yesButton = document.createElement('button');
            yesButton.textContent = 'Yes, proceed';
            yesButton.onclick = () => handleConfirmation(true);

            const noButton = document.createElement('button');
            noButton.textContent = 'No, cancel';
            noButton.onclick = () => handleConfirmation(false);

            confirmationButtons.appendChild(yesButton);
            confirmationButtons.appendChild(noButton);
            chatWindow.appendChild(confirmationButtons);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            // Disable main input
            messageInput.disabled = true;
            document.getElementById('send-button').disabled = true;
        }

        function addTable(data) {
            if (!Array.isArray(data) || data.length === 0) {
                addMessage("No items to display.", 'ai');
                return;
            }

            const table = document.createElement('table');
            const thead = document.createElement('thead');
            const tbody = document.createElement('tbody');

            // Create header row
            const headerRow = document.createElement('tr');
            const headers = Object.keys(data[0]);
            headers.forEach(headerText => {
                const th = document.createElement('th');
                th.textContent = headerText;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);

            // Create body rows
            data.forEach(item => {
                const row = document.createElement('tr');
                headers.forEach(header => {
                    const cell = document.createElement('td');
                    cell.textContent = item[header];
                    row.appendChild(cell);
                });
                tbody.appendChild(row);
            });

            table.appendChild(thead);
            table.appendChild(tbody);
            chatWindow.appendChild(table);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function addPreview(iframeString) {
            const previewContainer = document.createElement('div');
            previewContainer.classList.add('message', 'ai-message');
            previewContainer.innerHTML = iframeString; // Directly render the iframe
            chatWindow.appendChild(previewContainer);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function addInsights(data) {
            const table = document.createElement('table');
            const tbody = document.createElement('tbody');

            for (const [key, value] of Object.entries(data)) {
                const row = document.createElement('tr');
                const keyCell = document.createElement('td');
                keyCell.style.fontWeight = 'bold';
                keyCell.textContent = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase()); // Format key

                const valueCell = document.createElement('td');
                valueCell.textContent = value;

                row.appendChild(keyCell);
                row.appendChild(valueCell);
                tbody.appendChild(row);
            }

            table.appendChild(tbody);
            chatWindow.appendChild(table);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        async function handleConfirmation(isApproved) {
            // Remove confirmation buttons
            document.querySelector('.confirmation-buttons').remove();

            if (isApproved) {
                addMessage("OK, executing the action...", 'user');
                const response = await fetch('/execute', { method: 'POST' });
                const result = await response.json();

                if (result.type === 'list') {
                    addMessage("Here are the results:", 'ai');
                    addTable(result.payload);
                } else if (result.type === 'insights') {
                    addMessage("Here are the performance insights:", 'ai');
                    addInsights(result.payload);
                } else if (result.type === 'preview') {
                    addMessage("Here is the ad preview:", 'ai');
                    addPreview(result.payload);
                } else {
                    addMessage(result.payload, 'ai');
                }

            } else {
                addMessage("Action cancelled.", 'user');
                // Optionally, inform the AI the action was cancelled
                // await fetch('/chat', { ... body: { message: "User cancelled the action." } ... });
            }

            // Re-enable main input
            messageInput.disabled = false;
            document.getElementById('send-button').disabled = false;
            messageInput.focus();
        }

        async function sendChatMessage(messageText) {
            // Refactored chat logic into its own function
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: messageText }),
                });
                const aiResponse = await response.json();

                if (aiResponse.type === 'message') {
                    const responseText = aiResponse.payload;
                    addMessage(responseText, 'ai');
                    // Check for either image or video upload request
                    if (responseText.includes("(Please upload an image)") || responseText.includes("(Please upload a video)")) {
                        showUploadForm();
                    }
                } else if (aiResponse.type === 'confirmation') {
                    addConfirmationMessage(aiResponse.payload);
                } else if (aiResponse.type === 'list') {
                    addMessage("Here are the campaigns I found:", 'ai');
                    addTable(aiResponse.payload);
                } else if (aiResponse.type === 'insights') {
                    addMessage("Here are the performance insights:", 'ai');
                    addInsights(aiResponse.payload);
                } else if (aiResponse.type === 'preview') {
                    addMessage("Here is the ad preview:", 'ai');
                    addPreview(aiResponse.payload);
                }
            } catch (error) {
                console.error('Error:', error);
                addMessage('Sorry, something went wrong. Please check the console.', 'ai');
            }
        }

        function showUploadForm() {
            uploadForm.style.display = 'flex';
            chatForm.style.display = 'none';
        }

        function hideUploadForm() {
            uploadForm.style.display = 'none';
            chatForm.style.display = 'flex';
            messageInput.focus();
        }
    </script>
</body>
</html>
